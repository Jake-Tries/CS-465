<h2 class="mb-4">Travlr Getaways Admin</h2>

<div class="mb-3">
  <a class="btn btn-info" href="/add-trip">Add Trip</a>
</div>

<p>Trip count: {{ trips.length }}</p>

<div class="row">
  @for (trip of trips; track $index) {
    <div class="col-md-4">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  }
</div>
