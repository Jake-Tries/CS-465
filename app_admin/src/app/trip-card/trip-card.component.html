<div class="card h-100">
  <img class="card-img-top" src="assets/images/{{ trip.image }}" alt="{{ trip.name }}">

  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>

    <p class="card-text">{{ trip.description }}</p>

    <p><strong>Resort:</strong> {{ trip.resort }}</p>
    <p><strong>Length:</strong> {{ trip.length }}</p>
    <p><strong>Per Person:</strong> {{ trip.perPerson }}</p>

    <div class="d-flex gap-2" *ngIf="isLoggedIn()">
      <a class="btn btn-primary" [routerLink]="['/edit-trip', trip.code]">Edit</a>
      <button class="btn btn-danger" (click)="onDelete()">Delete</button>
    </div>
  </div>
</div>
