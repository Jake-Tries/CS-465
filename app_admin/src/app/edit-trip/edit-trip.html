<div class="col-md-6">
  <h2>Edit Trip</h2>

  <p *ngIf="message">{{ message }}</p>

  <form *ngIf="editForm" [formGroup]="editForm" (ngSubmit)="onSubmit()">

    <div class="form-group mb-3">
      <label>Code</label>
      <input type="text" class="form-control" formControlName="code" readonly>
    </div>

    <div class="form-group mb-3">
      <label>Name</label>
      <input type="text" class="form-control" formControlName="name">
    </div>

    <div class="form-group mb-3">
      <label>Length</label>
      <input type="text" class="form-control" formControlName="length">
    </div>

    <div class="form-group mb-3">
      <label>Start</label>
      <input type="date" class="form-control" formControlName="start">
    </div>

    <div class="form-group mb-3">
      <label>Resort</label>
      <input type="text" class="form-control" formControlName="resort">
    </div>

    <div class="form-group mb-3">
      <label>Price Per Person</label>
      <input type="number" class="form-control" formControlName="perPerson">
    </div>

    <div class="form-group mb-3">
      <label>Image</label>
      <input type="text" class="form-control" formControlName="image">
    </div>

    <div class="form-group mb-3">
      <label>Description</label>
      <textarea class="form-control" formControlName="description"></textarea>
    </div>

    <button type="submit" class="btn btn-info">Save</button>

  </form>
</div>
